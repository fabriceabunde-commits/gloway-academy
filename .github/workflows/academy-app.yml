name: Validate React migration
on:
  push:
    branches: [phase-0-react-migration]
  pull_request:
    paths:
      - 'academy-app/**'
      - '.github/workflows/academy-app.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: academy-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: academy-browser-results
          path: |
            academy-app/test-results
            academy-app/playwright-report
          if-no-files-found: ignore
